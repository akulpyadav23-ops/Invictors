name: CI

on:
  push:
    branches: [main, anish]
  pull_request:
    branches: [main, anish]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test mission content
        run: cp server/content/mission.example.json server/content/mission.json

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build validation
        run: npm run build
